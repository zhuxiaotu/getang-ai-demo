<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>南京江北新区葛塘污水处理厂</title>
  <script src="./chart.umd.min.js"></script>
  <style>
    :root {
      --bg0: #e8eef2;
      --bg1: #f4f7f9;
      --ink: #132028;
      --muted: #5a6b75;
      --line: rgba(19, 32, 40, 0.12);
      --teal: #0d6e6e;
      --teal-deep: #084848;
      --warn: #b45309;
      --bad: #b42318;
      --ok: #1a7a4c;
      --panel: rgba(255, 255, 255, 0.78);
      --shadow: 0 18px 50px rgba(19, 32, 40, 0.08);
      --radius: 18px;
      --mono: "SF Mono", "Menlo", "Consolas", ui-monospace, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --serif: "Songti SC", "STSong", "SimSun", serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(13, 110, 110, 0.18), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(180, 83, 9, 0.10), transparent 50%),
        linear-gradient(180deg, #d9e5ea 0%, var(--bg0) 38%, var(--bg1) 100%);
      min-height: 100vh;
    }

    .wrap {
      width: min(1680px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    @media (min-width: 1400px) {
      .wrap { width: min(1760px, calc(100% - 48px)); }
      .chart-box { height: 260px; }
    }
    @media (min-width: 1800px) {
      .wrap { width: calc(100% - 64px); max-width: 1920px; }
      .chart-box { height: 300px; }
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }
    .brand-kicker {
      margin: 0 0 6px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal);
    }
    .brand-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(22px, 3.2vw, 34px);
      line-height: 1.25;
      letter-spacing: 0.02em;
      max-width: 18em;
    }
    .brand-sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 46ch;
    }
    .badge {
      flex-shrink: 0;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .step {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.55);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: left;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .step:hover { transform: translateY(-1px); border-color: rgba(13,110,110,.35); }
    .step.is-active {
      background: #fff;
      border-color: rgba(13,110,110,.45);
      box-shadow: var(--shadow);
    }
    .step.is-done { border-color: rgba(26,122,76,.28); }
    .step-num {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--teal);
      margin-bottom: 4px;
    }
    .step-label { display: block; font-size: 13px; font-weight: 600; }
    .step[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

    .stage {
      display: grid;
      grid-template-columns: 1.35fr 0.9fr;
      gap: 16px;
      align-items: stretch;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .panel-body { padding: 16px 18px 18px; }
    .aside-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 420px;
    }
    .aside-main { flex: 1 1 auto; min-height: 0; }

    .train-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      margin-bottom: 14px;
    }
    .train-item {
      min-width: 0;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 18px rgba(19, 32, 40, 0.04);
    }
    .train-item img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #eef3f6;
    }
    .train-item span {
      display: block;
      padding: 8px 4px 10px;
      text-align: center;
      font-size: clamp(11px, 1.05vw, 13px);
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink);
      white-space: normal;
      word-break: keep-all;
      background: #fff;
    }
    .train-item.is-hot {
      border-color: rgba(180,35,24,.4);
      box-shadow: 0 0 0 1px rgba(180,35,24,.12);
    }
    .train-item.is-hot span { color: #7a1f16; }
    .train-item.is-ok {
      border-color: rgba(26,122,76,.35);
    }
    .train-item.is-ok span { color: #145c39; }
    .train-item.is-focus {
      border-color: rgba(13,110,110,.45);
      box-shadow: 0 0 0 1px rgba(13,110,110,.12);
    }

    .upload-zone {
      margin-bottom: 14px;
      padding: 18px 16px;
      border-radius: 14px;
      border: 1.5px dashed rgba(13,110,110,.35);
      background: rgba(13,110,110,.04);
      text-align: center;
      transition: border-color .2s ease, background .2s ease;
    }
    .upload-zone.is-drag {
      border-color: var(--teal);
      background: rgba(13,110,110,.1);
    }
    .upload-zone.is-ready {
      border-style: solid;
      border-color: rgba(13,110,110,.4);
      background: rgba(255,255,255,0.85);
      text-align: left;
    }
    .upload-zone.is-hidden { display: none; }
    .upload-zone h3 {
      margin: 0 0 6px;
      font-size: 14px;
    }
    .upload-zone p {
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .upload-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .upload-zone.is-ready .upload-row { justify-content: flex-start; }
    .upload-zone input[type="file"] { display: none; }
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(13,110,110,.08);
      border: 1px solid rgba(13,110,110,.2);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--teal-deep);
    }
    .alert-banner {
      display: none;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(180,35,24,.28);
      background: rgba(180,35,24,.08);
      color: #7a1f16;
      font-size: 13px;
      line-height: 1.5;
    }
    .alert-banner.is-on { display: block; }
    .alert-banner strong { font-weight: 700; }

    .process {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .unit {
      position: relative;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      font-size: 12px;
      color: var(--muted);
      transition: all .25s ease;
    }
    .unit::after {
      content: "→";
      position: absolute;
      right: -11px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(19,32,40,.25);
      font-size: 11px;
    }
    .unit:last-child::after { content: none; }
    .unit.is-hot {
      color: #7a1f16;
      border-color: rgba(180,35,24,.35);
      background: rgba(180,35,24,.08);
      box-shadow: inset 0 0 0 1px rgba(180,35,24,.08);
    }
    .unit.is-fix {
      color: #145c39;
      border-color: rgba(26,122,76,.35);
      background: rgba(26,122,76,.08);
    }
    .unit.is-focus {
      color: var(--teal-deep);
      border-color: rgba(13,110,110,.4);
      background: rgba(13,110,110,.08);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .unit.is-hot,
    .unit.is-focus { cursor: pointer; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(19, 32, 40, 0.48);
      backdrop-filter: blur(4px);
    }
    .modal.is-on { display: flex; }
    .modal-card {
      width: min(920px, 100%);
      max-height: min(88vh, 900px);
      overflow: auto;
      border-radius: 18px;
      background: #f7fafb;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 28px 80px rgba(19,32,40,0.28);
      animation: modalIn .28s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .modal-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }
    .modal-head p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .modal-close {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      color: var(--ink);
    }
    .modal-body {
      padding: 16px 18px 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .modal-body.is-single { grid-template-columns: 1fr; max-width: 520px; margin: 0 auto; }
    .fault-card {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(180,35,24,.28);
      background: #fff;
      box-shadow: 0 10px 28px rgba(180,35,24,.08);
    }
    .fault-card img {
      display: block;
      width: 100%;
      height: 160px;
      object-fit: cover;
    }
    .fault-card .meta {
      padding: 12px 12px 14px;
    }
    .fault-card .meta h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #7a1f16;
    }
    .fault-card .meta p {
      margin: 0;
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
    }
    @media (max-width: 820px) {
      .modal-body { grid-template-columns: 1fr; }
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .kpi {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
    }
    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .kpi-value {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
    }
    .kpi.is-bad .kpi-value { color: var(--bad); }
    .kpi.is-warn .kpi-value { color: var(--warn); }
    .kpi.is-ok .kpi-value { color: var(--ok); }

    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .chart-box {
      position: relative;
      height: 240px;
      padding: 8px 10px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.85);
    }
    .chart-box h3 {
      margin: 4px 8px 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .chart-box.is-empty::after {
      content: "待执行仿真";
      position: absolute;
      inset: 36px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      background: rgba(255,255,255,0.55);
      border-radius: 8px;
      pointer-events: none;
    }

    .narrator {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(13,110,110,0.06);
      border: 1px dashed rgba(13,110,110,0.25);
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink);
    }
    .narrator strong { color: var(--teal-deep); }

    .ai-log {
      min-height: 280px;
      font-size: 13.5px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .ai-log .line { margin: 0 0 10px; opacity: 0; transform: translateY(4px); animation: fadeUp .45s ease forwards; }
    .ai-log .tag {
      display: inline-block;
      margin-right: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .04em;
    }
    .tag-a { background: rgba(180,83,9,.12); color: #8a4208; }
    .tag-b { background: rgba(13,110,110,.12); color: var(--teal-deep); }
    .tag-sys { background: rgba(19,32,40,.08); color: var(--muted); }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }

    .suggest-list { display: grid; gap: 10px; }
    .suggest {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      cursor: pointer;
    }
    .suggest input { margin-top: 3px; }
    .suggest h4 { margin: 0 0 4px; font-size: 13px; }
    .suggest p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .suggest.is-wrong {
      border-color: rgba(180,83,9,.35);
      background: rgba(180,83,9,.06);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 11px 18px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--teal); color: #fff; }
    .btn-ghost { background: rgba(255,255,255,0.8); border: 1px solid var(--line); color: var(--ink); }
    .btn-warn { background: #9a3412; color: #fff; }

    .progress {
      display: none;
      margin-top: 12px;
      height: 6px;
      border-radius: 999px;
      background: rgba(19,32,40,.08);
      overflow: hidden;
    }
    .progress.is-on { display: block; }
    .progress > i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--teal), #1a9a7a);
      animation: load 2.2s ease forwards;
    }
    @keyframes load { to { width: 100%; } }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .compare-card {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.82);
    }
    .compare-card h3 { margin: 0 0 10px; font-size: 14px; }
    .compare-card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .big-save {
      margin-top: 14px;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(13,110,110,.12), rgba(26,122,76,.10));
      border: 1px solid rgba(13,110,110,.2);
      text-align: center;
    }
    .big-save .num {
      font-family: var(--mono);
      font-size: 42px;
      color: var(--teal-deep);
      line-height: 1;
    }
    .big-save .cap { margin-top: 8px; color: var(--muted); font-size: 13px; }

    .compare-flash {
      display: none;
      margin: 0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(13,110,110,.25);
      background: linear-gradient(160deg, rgba(180,35,24,.07), rgba(13,110,110,.09));
      box-shadow: 0 14px 36px rgba(19,32,40,.08);
      animation: flashIn .55s ease both;
      flex-shrink: 0;
    }
    .compare-flash.is-on {
      display: block;
      margin-top: auto;
    }
    .aside-body:has(.compare-flash.is-on) .aside-main {
      max-height: 42vh;
      overflow: auto;
    }
    @keyframes flashIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .compare-flash-head {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      margin-bottom: 10px;
    }
    .compare-flash-head h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--teal-deep);
      line-height: 1.35;
    }
    .compare-flash-head span {
      font-size: 11px;
      color: var(--muted);
    }
    .compare-flash-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 6px;
      align-items: stretch;
    }
    .compare-flash .cf-vs {
      width: 28px;
      height: 28px;
      font-size: 10px;
    }
    .compare-flash .cf-col {
      padding: 10px 8px;
    }
    .compare-flash .cf-metric {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 5px 0;
    }
    .compare-flash .cf-metric .v { font-size: 13px; }
    .cf-col {
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.88);
    }
    .cf-col.is-before {
      border-color: rgba(180,35,24,.28);
      background: rgba(180,35,24,.07);
      animation: popBefore .5s ease .08s both;
    }
    .cf-col.is-after {
      border-color: rgba(26,122,76,.35);
      background: rgba(26,122,76,.08);
      animation: popAfter .55s ease .22s both;
    }
    @keyframes popBefore {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes popAfter {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: none; }
    }
    .cf-col h4 {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .cf-col.is-before h4 { color: #7a1f16; }
    .cf-col.is-after h4 { color: #145c39; }
    .cf-metric {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-top: 1px dashed rgba(19,32,40,.1);
      font-size: 12px;
    }
    .cf-metric:first-of-type { border-top: none; padding-top: 0; }
    .cf-metric .k { color: var(--muted); }
    .cf-metric .v {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 14px;
    }
    .cf-col.is-before .v { color: #9b2c1f; }
    .cf-col.is-after .v { color: #147a4a; }
    .cf-vs {
      align-self: center;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #0d6e6e;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      animation: pulseVs 1.4s ease-in-out infinite;
    }
    @keyframes pulseVs {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(13,110,110,.35); }
      50% { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(13,110,110,0); }
    }
    .cf-deltas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .cf-delta {
      text-align: center;
      padding: 8px 4px;
      border-radius: 10px;
      background: rgba(26,122,76,.1);
      border: 1px solid rgba(26,122,76,.22);
      animation: deltaUp .55s ease .4s both;
    }
    @keyframes deltaUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .cf-delta .d-num {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      color: #147a4a;
    }
    .cf-delta .d-cap {

      line-height: 1.3;
    }
    @media (max-width: 920px) {
      .aside-body { min-height: 0; }
      .aside-body:has(.compare-flash.is-on) .aside-main { max-height: none; }
      .compare-flash-grid { grid-template-columns: 1fr; }
      .compare-flash .cf-vs { width: 100%; height: 28px; border-radius: 8px; }
      .cf-deltas { grid-template-columns: 1fr; }
    }

    .footnote {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 920px) {
      .stage, .charts, .compare, .steps, .kpi-row { grid-template-columns: 1fr 1fr; }
      .steps { grid-template-columns: 1fr 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .train-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .stage, .charts, .compare, .kpi-row, .steps { grid-template-columns: 1fr; }
      .train-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .unit::after { content: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <p class="brand-kicker">GETANG · SIMULATION</p>
        <h1 class="brand-title">南京江北新区葛塘污水处理厂</h1>
      </div>
      <div class="badge">分析窗口 · 0–24 h · 15 min</div>
    </header>

    <nav class="steps" id="steps" aria-label="流程步骤"></nav>

    <div class="stage">
      <section class="panel">
        <div class="panel-head">
          <h2 id="panelTitle">基线仿真</h2>
          <span id="panelMeta" style="font-family:var(--mono);font-size:11px;color:var(--muted)">SCENARIO · BASELINE</span>
        </div>
        <div class="panel-body">
          <div class="train-grid" id="trainGrid" aria-label="工艺流程"></div>
          <div class="upload-zone" id="uploadZone">
            <h3>导入运行数据</h3>
            <p>支持 CSV / Excel（.xlsx）。可一键使用小时级示例数据，或自行导入后执行基线仿真。</p>
            <div class="upload-row">
              <button type="button" class="btn btn-ghost" id="pickFile">选择文件</button>
              <a class="btn btn-ghost" href="./sample_getang_hourly.csv" download>下载示例数据</a>
              <button type="button" class="btn btn-primary" id="runSample">使用示例数据运行</button>
              <span class="file-chip" id="uploadFileName">尚未选择文件</span>
            </div>
            <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,text/csv" />
          </div>
          <div class="alert-banner" id="alertBanner" role="status"></div>
          <div class="process" id="process"></div>
          <div class="kpi-row" id="kpis"></div>
          <div class="charts">
            <div class="chart-box">
              <h3>出水水质（TP / TN）</h3>
              <canvas id="chartWater"></canvas>
            </div>
            <div class="chart-box">
              <h3>PAC 投加流量与滤池工况</h3>
              <canvas id="chartOps"></canvas>
            </div>
          </div>
          <div class="narrator" id="narrator"></div>
          <div class="progress" id="progress"><i></i></div>
          <div class="actions" id="actions"></div>
        </div>
      </section>

      <aside class="panel panel-aside">
        <div class="panel-head">
          <h2 id="sideTitle">系统状态</h2>
        </div>
        <div class="panel-body aside-body">
          <div class="aside-main" id="sideBody"></div>
          <div class="compare-flash" id="compareFlash" aria-live="polite"></div>
        </div>
      </aside>
    </div>

  </div>

  <div class="modal" id="faultModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="faultModalTitle">
      <div class="modal-head">
        <div>
          <h3 id="faultModalTitle">异常工艺段示意</h3>
          <p id="faultModalSub">AI 诊断定位结果</p>
        </div>
        <button type="button" class="modal-close" id="faultModalClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="faultModalBody"></div>
    </div>
  </div>

  <script>
    const UNITS = ["格栅", "初沉", "厌氧", "缺氧", "好氧", "二沉", "高效沉淀", "深床滤池", "次钠消毒"];
    const TRAIN_META = {
      "格栅": { img: "./img/unit_screen.jpg" },
      "初沉": { img: "./img/unit_primary.jpg" },
      "厌氧": { img: "./img/unit_anaerobic.jpg" },
      "缺氧": { img: "./img/unit_anoxic.jpg" },
      "好氧": { img: "./img/unit_aerobic.jpg" },
      "二沉": { img: "./img/unit_secondary.jpg" },
      "高效沉淀": { img: "./img/unit_hes.jpg" },
      "深床滤池": { img: "./img/unit_filter.jpg" },
      "次钠消毒": { img: "./img/unit_disinfect.jpg" },
    };
    const FAULT_UNITS = {
      "厌氧": {
        img: "./img/unit_anaerobic.jpg",
        title: "厌氧池",
        desc: "生物除磷效能不足：厌氧释磷动力偏弱，回流比对厌氧区稀释过度，化学除磷被迫代偿。",
      },
      "高效沉淀": {
        img: "./img/unit_hes.jpg",
        title: "高效沉淀池",
        desc: "PAC 过量投加：絮凝负荷抬升，对下游深床滤池形成不利冲击。",
      },
      "深床滤池": {
        img: "./img/unit_filter.jpg",
        title: "反硝化深床滤池",
        desc: "受上游絮体负荷影响：运行压力与反冲洗频次升高，反硝化工况恶化，出水 TN 波动放大。",
      },
    };
    // 单日 0–24 h，15 min 一步（共 97 点）；波动加密、幅度收窄
    const WINDOW_HOURS = 24;
    const STEP_MINUTES = 15;
    const STEPS_PER_HOUR = 60 / STEP_MINUTES;
    const N = WINDOW_HOURS * STEPS_PER_HOUR + 1; // 0 … 24h
    const TIME_LABELS = Array.from({ length: N }, (_, i) => {
      const totalMin = i * STEP_MINUTES;
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return `${h}时${String(m).padStart(2, "0")}分`;
    });
    const SAMPLE_NAME = "sample_getang_hourly.csv";

    function seeded(seed) {
      let s = seed;
      return () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function hourOf(i) {
      return (i * STEP_MINUTES) / 60;
    }

    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    function movingAvg(arr, win) {
      const out = new Array(arr.length);
      for (let i = 0; i < arr.length; i++) {
        let s = 0, n = 0;
        for (let k = Math.max(0, i - win + 1); k <= i; k++) { s += arr[k]; n += 1; }
        out[i] = s / n;
      }
      return out;
    }

    // 带滞后的一阶传递：水质响应滞后于操作/负荷
    function lagFilter(input, alpha) {
      const out = new Array(input.length);
      out[0] = input[0];
      for (let i = 1; i < input.length; i++) out[i] = alpha * input[i] + (1 - alpha) * out[i - 1];
      return out;
    }

    /**
     * 分指标独立造数：PAC(kg/h)连续斜坡调节；TP/TN 不同相位与驱动；
     * 水质含仪表噪声；操作→水质带水力/反应滞后，避免同涨同跌。
     */
    function buildScenario(kind) {
      const rnd = seeded({ baseline: 101, pacOnly: 211, optimized: 307 }[kind] || 101);
      const loadTP = [];
      const loadTN = [];
      const pacSet = [];
      const pac = [];
      let pacSp = kind === "pacOnly" ? 58 : kind === "optimized" ? 46 : 52; // kg/h
      let pacNow = pacSp;
      let nextManual = 0;

      for (let i = 0; i < N; i++) {
        const h = hourOf(i);
        // 进水负荷：TP/TN 不同周期与相位（非同步）
        let tpLoad = 1
          + 0.12 * Math.sin((h / 24) * Math.PI * 2 + 0.4)
          + 0.06 * Math.sin((h / 8) * Math.PI * 2 + 1.2)
          + 0.04 * (rnd() - 0.5);
        let tnLoad = 1
          + 0.15 * Math.sin((h / 24) * Math.PI * 2 - 0.9)
          + 0.08 * Math.sin((h / 5.5) * Math.PI * 2 + 2.1)
          + 0.05 * (rnd() - 0.5);
        // 午后冲击主要抬 TN；傍晚冲击更偏 TP
        if (h >= 11 && h <= 14.5) tnLoad += 0.10 * Math.sin(((h - 11) / 3.5) * Math.PI);
        if (h >= 17.5 && h <= 20.5) tpLoad += 0.09 * Math.sin(((h - 17.5) / 3) * Math.PI);

        loadTP.push(tpLoad);
        loadTN.push(tnLoad);

        if (kind === "optimized") {
          // 精细：约 1–2 h 小步跟随负荷，连续逼近设定
          if (i % Math.round(1.25 * STEPS_PER_HOUR) === 0) {
            pacSp = clamp(46 + (tpLoad - 1) * 18 + (rnd() - 0.5) * 2.5, 38, 58);
          }
        } else {
          // 人工：数小时才改设定，经斜坡到达，非垂直跳变
          if (i === nextManual) {
            const bump = kind === "pacOnly" ? 10 + rnd() * 8 : (rnd() - 0.35) * 10;
            pacSp = clamp(pacSp + bump + (tpLoad - 1) * 6, kind === "pacOnly" ? 50 : 40, kind === "pacOnly" ? 72 : 64);
            nextManual = i + Math.round((3.5 + rnd() * 3.5) * STEPS_PER_HOUR);
          }
        }
        // 泵/计量连续跟踪设定（一阶斜坡 + 微小计量噪声）
        const track = kind === "optimized" ? 0.28 : 0.12;
        pacNow += (pacSp - pacNow) * track;
        pacNow += (rnd() - 0.5) * (kind === "optimized" ? 0.25 : 0.45);
        pac.push(+clamp(pacNow, 35, 75).toFixed(2));
        pacSet.push(pacSp);
      }

      // PAC 对除磷的作用滞后约 1.5–2.5 h；对滤池负荷滞后略短
      const pacLagTP = lagFilter(pac, 0.08);   // 更慢
      const pacLagFil = lagFilter(pac, 0.14);
      const loadTPLag = lagFilter(loadTP, 0.18);
      const loadTNLag = lagFilter(loadTN, 0.12); // TN 另一套时间常数

      const tp = [];
      const tn = [];
      const filter = [];
      for (let i = 0; i < N; i++) {
        const h = hourOf(i);
        // 生物除磷底噪 + 负荷驱动 − PAC 滞后效益（baseline 生物弱，除磷更依赖药）
        const bioWeak = kind === "optimized" ? 0.78 : 1.0;
        const pacEffect = (pacLagTP[i] - 48) * (kind === "pacOnly" ? 0.0035 : 0.0045);
        let tpV = 0.33 * bioWeak
          + 0.11 * (loadTPLag[i] - 1)
          - pacEffect
          + 0.015 * Math.sin(h / 3.2 + 0.5);
        // 仪表噪声（与 TN 不相关）
        tpV += (rnd() - 0.5) * 0.018 + (rnd() - 0.5) * 0.008;

        // TN：主要跟碳源/反硝化/滤池，几乎不跟 PAC 同步；相位独立
        const filterStressProxy = 48 + (pacLagFil[i] - 50) * 0.55 + (loadTNLag[i] - 1) * 8;
        let tnV = 10.2
          + 1.35 * (loadTNLag[i] - 1)
          + (filterStressProxy - 52) * 0.045
          + 0.35 * Math.sin(h / 4.7 - 1.3)
          + (kind === "optimized" ? -1.1 : 0)
          + (kind === "pacOnly" ? 0.35 : 0); // 过投加重滤池后 TN 略差
        tnV += (rnd() - 0.5) * 0.22 + (rnd() - 0.5) * 0.1;

        let filV = filterStressProxy
          + 1.2 * Math.sin(h / 6.5 + 2)
          + (rnd() - 0.5) * 1.4;
        if (kind === "optimized") filV -= 8;
        if (kind === "pacOnly") filV += 6;

        tp.push(+clamp(tpV, 0.12, 0.55).toFixed(3));
        tn.push(+clamp(tnV, 6.5, 14.5).toFixed(2));
        filter.push(+clamp(filV, 28, 85).toFixed(1));
      }

      // 轻微平滑仅压掉极端毛刺，保留传感器纹理
      const tpShow = tp.map((v, i) => +((v * 0.7 + movingAvg(tp, 2)[i] * 0.3)).toFixed(3));
      const tnShow = tn.map((v, i) => +((v * 0.65 + movingAvg(tn, 2)[i] * 0.35)).toFixed(2));

      const hit = new Set();
      for (let i = 0; i < N; i++) {
        if (tpShow[i] > 0.40 || tnShow[i] > 12.0) hit.add(Math.floor(hourOf(i)));
      }

      return {
        tp: tpShow,
        tn: tnShow,
        pac,
        filter,
        cost: kind === "baseline" ? 0.112 : kind === "pacOnly" ? 0.131 : 0.086,
        exceedDays: kind === "optimized" ? 0 : hit.size,
        backwash: kind === "baseline" ? 2 : kind === "pacOnly" ? 3 : 1,
      };
    }

    const DATA = {
      baseline: buildScenario("baseline"),
      pacOnly: buildScenario("pacOnly"),
      optimized: buildScenario("optimized"),
    };

    const STEPS = [
      { id: "baseline", label: "基线仿真", meta: "SCENARIO · BASELINE" },
      { id: "diagnose", label: "AI 诊断", meta: "AI · ROOT CAUSE" },
      { id: "suggest", label: "调控方案", meta: "PLAN · ACTIONS" },
      { id: "resim", label: "方案再仿真", meta: "COMPARE · PATHS" },
      { id: "result", label: "效果对比", meta: "RESULT · CLOSED LOOP" },
    ];

    let step = 0;
    let unlocked = 0;
    let baselineRan = false;
    let uploadedName = "";
    let currentView = "idle";
    let charts = { water: null, ops: null };

    const el = {
      steps: document.getElementById("steps"),
      process: document.getElementById("process"),
      kpis: document.getElementById("kpis"),
      narrator: document.getElementById("narrator"),
      actions: document.getElementById("actions"),
      sideBody: document.getElementById("sideBody"),
      sideTitle: document.getElementById("sideTitle"),
      panelTitle: document.getElementById("panelTitle"),
      panelMeta: document.getElementById("panelMeta"),
      progress: document.getElementById("progress"),
      uploadZone: document.getElementById("uploadZone"),
      alertBanner: document.getElementById("alertBanner"),
      compareFlash: document.getElementById("compareFlash"),
      fileInput: document.getElementById("fileInput"),
      uploadFileName: document.getElementById("uploadFileName"),
      pickFile: document.getElementById("pickFile"),
      trainGrid: document.getElementById("trainGrid"),
    };

    function avg(arr) {
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }

    function metricSnap(d) {
      return {
        tp: +avg(d.tp).toFixed(2),
        pressure: Math.round(avg(d.filter)),
        cost: +d.cost.toFixed(3),
      };
    }

    function deltaText(before, after, digits, unit, invert = false) {
      const diff = after - before;
      const improved = invert ? diff < 0 : diff > 0;
      const sign = diff > 0 ? "+" : "";
      const pct = before === 0 ? 0 : (diff / before) * 100;
      return {
        abs: `${sign}${diff.toFixed(digits)}${unit}`,
        pct: `${sign}${pct.toFixed(0)}%`,
        good: invert ? diff < 0 : diff > 0,
      };
    }

    function hideCompareFlash() {
      el.compareFlash.classList.remove("is-on");
      el.compareFlash.innerHTML = "";
    }

    function showCompareFlash(beforeData, afterData, title = "基线仿真 vs AI 方案") {
      const b = metricSnap(beforeData);
      const a = metricSnap(afterData);
      const dTp = deltaText(b.tp, a.tp, 2, "", true);
      const dP = deltaText(b.pressure, a.pressure, 0, "", true);
      const dC = deltaText(b.cost, a.cost, 3, "", true);
      const savePct = b.cost === 0 ? 0 : ((b.cost - a.cost) / b.cost * 100);

      el.compareFlash.innerHTML = `
        <div class="compare-flash-head">
          <h3>${title}</h3>
          <span>降本增效对照</span>
        </div>
        <div class="compare-flash-grid">
          <div class="cf-col is-before">
            <h4>图1 · 基线仿真</h4>
            <div class="cf-metric"><span class="k">出水 TP 均值</span><span class="v">${b.tp} mg/L</span></div>
            <div class="cf-metric"><span class="k">滤池压力均值</span><span class="v">${b.pressure}</span></div>
            <div class="cf-metric"><span class="k">单位药耗</span><span class="v">${b.cost} 元/m³</span></div>
          </div>
          <div class="cf-vs" aria-hidden="true">VS</div>
          <div class="cf-col is-after">
            <h4>图3 · AI 方案</h4>
            <div class="cf-metric"><span class="k">出水 TP 均值</span><span class="v">${a.tp} mg/L</span></div>
            <div class="cf-metric"><span class="k">滤池压力均值</span><span class="v">${a.pressure}</span></div>
            <div class="cf-metric"><span class="k">单位药耗</span><span class="v">${a.cost} 元/m³</span></div>
          </div>
        </div>
        <div class="cf-deltas">
          <div class="cf-delta">
            <div class="d-num">${dTp.pct}</div>
            <div class="d-cap">TP ${b.tp} → ${a.tp}</div>
          </div>
          <div class="cf-delta">
            <div class="d-num">${dP.pct}</div>
            <div class="d-cap">压力 ${b.pressure} → ${a.pressure}</div>
          </div>
          <div class="cf-delta">
            <div class="d-num">↓${Math.abs(savePct).toFixed(0)}%</div>
            <div class="d-cap">药耗 ${b.cost} → ${a.cost}</div>
          </div>
        </div>
      `;
      el.compareFlash.classList.remove("is-on");
      void el.compareFlash.offsetWidth;
      el.compareFlash.classList.add("is-on");
    }

    function renderSteps() {
      el.steps.innerHTML = STEPS.map((s, i) => `
        <button class="step ${i === step ? "is-active" : ""} ${i < unlocked || i <= step ? "is-done" : ""}"
          data-i="${i}" ${i > unlocked ? "disabled" : ""}>
          <span class="step-num">0${i + 1}</span>
          <span class="step-label">${s.label}</span>
        </button>
      `).join("");
      el.steps.querySelectorAll(".step").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = +btn.dataset.i;
          if (i <= unlocked) go(i);
        });
      });
    }

    function setUnits(mode) {
      // 异常工段仅在 AI 诊断点击后高亮，基线仿真只出指标不点名工段
      const hot = {
        idle: [],
        baseline: [],
        diagnose: ["厌氧", "高效沉淀", "深床滤池"],
        suggest: ["厌氧", "高效沉淀", "深床滤池"],
        pacOnly: ["高效沉淀", "深床滤池"],
        optimized: [],
      };
      const focus = {
        idle: [],
        baseline: [],
        diagnose: ["厌氧", "高效沉淀", "深床滤池"],
        suggest: ["厌氧", "二沉", "高效沉淀"],
        pacOnly: ["高效沉淀"],
        optimized: ["厌氧", "高效沉淀", "深床滤池"],
      };
      const h = hot[mode] || [];
      const f = focus[mode] || [];
      const okMode = mode === "optimized" || mode === "result";
      el.process.innerHTML = UNITS.map((u) => {
        let cls = "unit";
        if (okMode) cls += " is-ok";
        else if (h.includes(u)) cls += " is-hot";
        if (f.includes(u)) cls += " is-focus";
        const clickable = FAULT_UNITS[u] && (h.includes(u) || f.includes(u) || okMode);
        return `<span class="${cls}" data-unit="${u}" ${clickable ? 'role="button" tabindex="0"' : ""}>${u}</span>`;
      }).join("");

      el.trainGrid.innerHTML = UNITS.map((u) => {
        let cls = "train-item";
        if (okMode && FAULT_UNITS[u]) cls += " is-ok";
        else if (h.includes(u)) cls += " is-hot";
        if (f.includes(u)) cls += " is-focus";
        const meta = TRAIN_META[u] || {};
        const clickable = FAULT_UNITS[u] && (h.includes(u) || f.includes(u) || okMode);
        return `
          <article class="${cls}" data-unit="${u}" ${clickable ? 'role="button" tabindex="0"' : ""}>
            <img src="${meta.img}" alt="${u}" />
            <span>${u}</span>
          </article>
        `;
      }).join("");

      const bindOpen = (node) => {
        const key = node.dataset.unit;
        if (!FAULT_UNITS[key]) return;
        if (!(h.includes(key) || f.includes(key) || okMode)) return;
        const open = () => openFaultModal([key]);
        node.addEventListener("click", open);
        node.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            open();
          }
        });
      };
      el.process.querySelectorAll("[data-unit]").forEach(bindOpen);
      el.trainGrid.querySelectorAll("[data-unit]").forEach(bindOpen);
    }

    function openFaultModal(keys) {
      const list = (keys && keys.length ? keys : Object.keys(FAULT_UNITS))
        .filter((k) => FAULT_UNITS[k]);
      if (!list.length) return;
      const body = document.getElementById("faultModalBody");
      const title = document.getElementById("faultModalTitle");
      const sub = document.getElementById("faultModalSub");
      body.classList.toggle("is-single", list.length === 1);
      title.textContent = list.length === 1
        ? `异常工艺段 · ${FAULT_UNITS[list[0]].title}`
        : "异常工艺段示意";
      sub.textContent = list.length === 1
        ? "单击工艺节点查看单段示意"
        : "AI 诊断定位结果（可关闭后再次点击红色工艺节点）";
      body.innerHTML = list.map((k) => {
        const item = FAULT_UNITS[k];
        return `
          <article class="fault-card">
            <img src="${item.img}" alt="${item.title}" />
            <div class="meta">
              <h4>${item.title}</h4>
              <p>${item.desc}</p>
            </div>
          </article>
        `;
      }).join("");
      const modal = document.getElementById("faultModal");
      modal.classList.add("is-on");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeFaultModal() {
      const modal = document.getElementById("faultModal");
      modal.classList.remove("is-on");
      modal.setAttribute("aria-hidden", "true");
    }

    function bindFaultModal() {
      document.getElementById("faultModalClose").onclick = closeFaultModal;
      document.getElementById("faultModal").addEventListener("click", (e) => {
        if (e.target.id === "faultModal") closeFaultModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeFaultModal();
      });
    }

    function setAlert(on, html = "") {
      el.alertBanner.classList.toggle("is-on", !!on);
      el.alertBanner.innerHTML = on ? html : "";
    }

    function setUploadVisible(on) {
      el.uploadZone.classList.toggle("is-hidden", !on);
    }

    function useSampleData(autoRun = false) {
      uploadedName = SAMPLE_NAME;
      el.uploadFileName.textContent = uploadedName;
      el.uploadZone.classList.add("is-ready");
      updateIdleActions();
      el.sideTitle.textContent = "示例数据已载入";
      el.sideBody.innerHTML = `<div class="ai-log" id="obs"></div>`;
      typeLines(document.getElementById("obs"), [
        `<span class="tag tag-sys">DATA</span>已载入示例数据：${SAMPLE_NAME}`,
        `<span class="tag tag-sys">DATA</span>采样频率：${STEP_MINUTES} min；分析窗口：0–24 h（共 ${N} 个时点）。`,
        `<span class="tag tag-sys">NEXT</span>${autoRun ? "正在启动基线仿真…" : "可执行基线仿真，开展出水与药剂工况评估。"}`,
      ], 180);
      if (autoRun) setTimeout(() => runBaselineSim(), 450);
    }

    function bindUpload() {
      el.pickFile.onclick = () => el.fileInput.click();
      const runSampleBtn = document.getElementById("runSample");
      if (runSampleBtn) runSampleBtn.onclick = () => useSampleData(true);
      el.fileInput.onchange = () => {
        const f = el.fileInput.files && el.fileInput.files[0];
        if (!f) return;
        onFileChosen(f);
      };
      ["dragenter", "dragover"].forEach((ev) => {
        el.uploadZone.addEventListener(ev, (e) => {
          e.preventDefault();
          el.uploadZone.classList.add("is-drag");
        });
      });
      ["dragleave", "drop"].forEach((ev) => {
        el.uploadZone.addEventListener(ev, (e) => {
          e.preventDefault();
          el.uploadZone.classList.remove("is-drag");
        });
      });
      el.uploadZone.addEventListener("drop", (e) => {
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) onFileChosen(f);
      });
    }

    function onFileChosen(file) {
      const ok = /\.(csv|xlsx|xls)$/i.test(file.name);
      if (!ok) {
        el.uploadFileName.textContent = "文件格式无效，请使用 CSV / Excel";
        uploadedName = "";
        el.uploadZone.classList.remove("is-ready");
        updateIdleActions();
        return;
      }
      uploadedName = file.name;
      el.uploadFileName.textContent = uploadedName;
      el.uploadZone.classList.add("is-ready");
      updateIdleActions();
      el.sideTitle.textContent = "数据已导入";
      el.sideBody.innerHTML = `<div class="ai-log" id="obs"></div>`;
      typeLines(document.getElementById("obs"), [
        `<span class="tag tag-sys">DATA</span>已导入：${uploadedName}`,
        `<span class="tag tag-sys">DATA</span>按 ${STEP_MINUTES} min 序列校验；演示窗口 0–24 h（${N} 个时点）。`,
        `<span class="tag tag-sys">NEXT</span>可执行基线仿真，开展出水与药剂工况评估。`,
      ], 200);
    }

    function updateIdleActions() {
      if (baselineRan) return;
      if (!uploadedName) {
        el.actions.innerHTML = `<button class="btn btn-primary" id="runBase" disabled>请先导入数据</button>`;
        return;
      }
      el.actions.innerHTML = `<button class="btn btn-primary" id="runBase">执行基线仿真 →</button>`;
      document.getElementById("runBase").onclick = () => runBaselineSim();
    }

    function kpiHtml(d, tone) {
      if (tone === "idle") {
        return `
          <div class="kpi"><div class="kpi-label">TP 峰值 mg/L</div><div class="kpi-value">—</div></div>
          <div class="kpi"><div class="kpi-label">超标风险小时</div><div class="kpi-value">—</div></div>
          <div class="kpi"><div class="kpi-label">滤池压力指数</div><div class="kpi-value">—</div></div>
          <div class="kpi"><div class="kpi-label">单位药耗 元/m³</div><div class="kpi-value">—</div></div>
        `;
      }
      const t = (key) => {
        if (tone === "bad") return "is-bad";
        if (tone === "warn") return key === "cost" || key === "filter" ? "is-warn" : "is-bad";
        return "is-ok";
      };
      return `
        <div class="kpi ${t("tp")}"><div class="kpi-label">TP 峰值 mg/L</div><div class="kpi-value">${Math.max(...d.tp).toFixed(2)}</div></div>
        <div class="kpi ${t("tn")}"><div class="kpi-label">超标风险小时</div><div class="kpi-value">${d.exceedDays}</div></div>
        <div class="kpi ${t("filter")}"><div class="kpi-label">滤池压力指数</div><div class="kpi-value">${Math.round(d.filter.reduce((a,b)=>a+b,0)/d.filter.length)}</div></div>
        <div class="kpi ${t("cost")}"><div class="kpi-label">单位药耗 元/m³</div><div class="kpi-value">${d.cost.toFixed(3)}</div></div>
      `;
    }

    function clearCharts() {
      destroyCharts();
      ["chartWater", "chartOps"].forEach((id) => {
        const canvas = document.getElementById(id);
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const { width, height } = canvas;
        ctx.clearRect(0, 0, width, height);
      });
      const waterBox = document.getElementById("chartWater")?.parentElement;
      const opsBox = document.getElementById("chartOps")?.parentElement;
      if (waterBox) waterBox.classList.add("is-empty");
      if (opsBox) opsBox.classList.add("is-empty");
    }

    function markChartsReady() {
      document.querySelectorAll(".chart-box").forEach((box) => box.classList.remove("is-empty"));
    }

    function destroyCharts() {
      if (charts.water) charts.water.destroy();
      if (charts.ops) charts.ops.destroy();
      charts = { water: null, ops: null };
    }

    function makeCharts(d, animate = true) {
      destroyCharts();
      markChartsReady();
      const xTicks = {
        font: { size: 10 },
        maxRotation: 0,
        minRotation: 0,
        autoSkip: false,
        callback(val) {
          // 每 4 小时一个刻度（15 min 一步时，步进 16）
          const i = Number(val);
          if (!Number.isFinite(i) || i % (4 * STEPS_PER_HOUR) !== 0) return null;
          return `${Math.round(hourOf(i))}时`;
        },
      };
      const axisTitle = {
        display: true,
        color: "#5a6b75",
        font: { size: 11, weight: "600" },
        padding: { top: 4, bottom: 2 },
      };
      const common = {
        responsive: true,
        maintainAspectRatio: false,
        animation: animate ? { duration: 700 } : false,
        layout: { padding: { top: 4, right: 6, bottom: 2, left: 2 } },
        plugins: {
          legend: {
            labels: { boxWidth: 10, font: { size: 11 }, color: "#132028" },
          },
          tooltip: {
            callbacks: {
              title(items) {
                const i = items[0] && items[0].dataIndex;
                return Number.isFinite(i) ? TIME_LABELS[i] : "";
              },
            },
          },
        },
        scales: {
          x: {
            ticks: { ...xTicks, font: { size: 10 } },
            grid: { color: "rgba(19,32,40,0.05)" },
            title: { ...axisTitle, text: "时间（0–24 h）", padding: { top: 8 } },
          },
          y: { ticks: { font: { size: 10 } }, grid: { color: "rgba(19,32,40,0.06)" } },
        },
      };
      charts.water = new Chart(document.getElementById("chartWater"), {
        type: "line",
        data: {
          labels: TIME_LABELS,
          datasets: [
            {
              label: "出水 TP",
              data: d.tp,
              borderColor: "#b42318",
              backgroundColor: "rgba(180,35,24,0.08)",
              tension: 0.12,
              pointRadius: 0,
              borderWidth: 1.5,
              yAxisID: "y",
            },
            {
              label: "出水 TN",
              data: d.tn,
              borderColor: "#0d6e6e",
              backgroundColor: "transparent",
              tension: 0.12,
              pointRadius: 0,
              borderWidth: 1.5,
              yAxisID: "y1",
            },
          ],
        },
        options: {
          ...common,
          scales: {
            ...common.scales,
            y: {
              ...common.scales.y,
              position: "left",
              title: { ...axisTitle, text: "TP (mg/L)" },
            },
            y1: {
              ...common.scales.y,
              position: "right",
              grid: { drawOnChartArea: false },
              title: { ...axisTitle, text: "TN (mg/L)" },
            },
          },
        },
      });
      charts.ops = new Chart(document.getElementById("chartOps"), {
        type: "line",
        data: {
          labels: TIME_LABELS,
          datasets: [
            {
              label: "PAC 投加流量",
              data: d.pac,
              borderColor: "#9a3412",
              pointRadius: 0,
              borderWidth: 1.6,
              tension: 0.2,
              yAxisID: "y",
            },
            {
              label: "滤池压力",
              data: d.filter,
              borderColor: "#486581",
              backgroundColor: "rgba(72,101,129,0.12)",
              fill: true,
              tension: 0.18,
              pointRadius: 0,
              borderWidth: 1.4,
              yAxisID: "y1",
            },
          ],
        },
        options: {
          ...common,
          scales: {
            ...common.scales,
            y: {
              ...common.scales.y,
              position: "left",
              title: { ...axisTitle, text: "PAC (kg/h)" },
            },
            y1: {
              ...common.scales.y,
              position: "right",
              grid: { drawOnChartArea: false },
              title: { ...axisTitle, text: "滤池压力指数" },
            },
          },
        },
      });
    }

    function typeLines(container, lines, delay = 380) {
      container.innerHTML = "";
      lines.forEach((line, i) => {
        const div = document.createElement("div");
        div.className = "line";
        div.style.animationDelay = `${i * delay}ms`;
        div.innerHTML = line;
        container.appendChild(div);
      });
    }

    function go(i) {
      step = i;
      unlocked = Math.max(unlocked, i);
      renderSteps();
      const id = STEPS[i].id;
      el.panelTitle.textContent = STEPS[i].label;
      el.panelMeta.textContent = STEPS[i].meta;
      el.progress.classList.remove("is-on");
      el.progress.innerHTML = "<i></i>";
      if (id !== "diagnose") closeFaultModal();
      if (id !== "baseline" || baselineRan) setUploadVisible(false);
      if (id !== "result") hideCompareFlash();

      if (id === "baseline") renderBaseline();
      if (id === "diagnose") renderDiagnose();
      if (id === "suggest") renderSuggest();
      if (id === "resim") renderResim();
      if (id === "result") renderResult();
    }

    function renderBaselineIdle() {
      currentView = "idle";
      setUnits("idle");
      setAlert(false);
      hideCompareFlash();
      setUploadVisible(true);
      el.kpis.innerHTML = kpiHtml(null, "idle");
      clearCharts();
      el.panelTitle.textContent = "基线仿真";
      el.panelMeta.textContent = "READY · UPLOAD";
      el.narrator.innerHTML = "";
      if (uploadedName) {
        el.uploadFileName.textContent = uploadedName;
        el.uploadZone.classList.add("is-ready");
      } else {
        el.uploadFileName.textContent = "尚未选择文件";
        el.uploadZone.classList.remove("is-ready");
      }
      updateIdleActions();

      el.sideTitle.textContent = "就绪状态";
      el.sideBody.innerHTML = `<div class="ai-log" id="obs"></div>`;
      typeLines(document.getElementById("obs"), [
        `<span class="tag tag-sys">READY</span>工艺流程：格栅 → 初沉 → 改良 A²/O → 二沉 → 高效沉淀 → 深床滤池 → 次钠消毒。`,
        `<span class="tag tag-sys">READY</span>可点击「使用示例数据运行」，或自行导入 CSV / Excel。`,
        `<span class="tag tag-sys">READY</span>数据为小时级序列；基线仿真后给出指标评估，异常工艺定位需执行 AI 诊断。`,
      ], 220);
    }

    function showBaselineResult() {
      currentView = "baseline";
      setUploadVisible(false);
      setUnits("baseline");
      setAlert(
        true,
        `<strong>指标偏离控制目标</strong> · 数据源 ${uploadedName || "demo"}：出水 TP/TN 小时序列波动增大，单位药耗偏高。请执行 AI 诊断以识别异常工艺段。`
      );
      el.kpis.innerHTML = kpiHtml(DATA.baseline, "bad");
      makeCharts(DATA.baseline);
      el.panelTitle.textContent = "基线仿真";
      el.panelMeta.textContent = "SCENARIO · HOURLY";
      el.narrator.innerHTML = "";
      el.actions.innerHTML = `<button class="btn btn-primary" id="toDiag">执行 AI 诊断 →</button>`;
      document.getElementById("toDiag").onclick = () => { unlocked = Math.max(unlocked, 1); go(1); };

      el.sideTitle.textContent = "基线评估";
      el.sideBody.innerHTML = `<div class="ai-log" id="obs"></div>`;
      typeLines(document.getElementById("obs"), [
        `<span class="tag tag-sys">OBS</span>出水 TP、TN 走势不同步：TN 午后抬升更明显，TP 傍晚段相对偏高。`,
        `<span class="tag tag-sys">OBS</span>PAC 以 kg/h 连续斜坡调节，人工改设定间隔约 3.5–7 h，水质响应存在滞后。`,
        `<span class="tag tag-sys">OBS</span>滤池压力指数偏高，窗口内反冲洗约 ${DATA.baseline.backwash} 次。`,
        `<span class="tag tag-sys">NEXT</span>异常工艺段尚未定位，建议执行 AI 诊断。`,
      ], 280);
    }

    function runBaselineSim() {
      if (!uploadedName) return;
      setUploadVisible(false);
      setAlert(false);
      el.actions.innerHTML = "";
      el.narrator.innerHTML = `正在计算：基于 <strong>${uploadedName}</strong>，按现行人工投加策略开展 0–24 h 基线仿真…`;
      el.sideTitle.textContent = "仿真计算中";
      el.sideBody.innerHTML = `<div class="ai-log">数据校验通过\n${STEP_MINUTES} min 进水负荷序列载入（0–24 h，${N} 时点）\n单元串联：格栅 → 初沉 → 厌氧 → 沉淀 → 深床滤池 → 出水指标</div>`;
      el.progress.classList.add("is-on");
      const bar = el.progress.querySelector("i");
      bar.style.animation = "none";
      void bar.offsetWidth;
      bar.style.animation = "";
      setTimeout(() => {
        baselineRan = true;
        el.progress.classList.remove("is-on");
        el.progress.innerHTML = "<i></i>";
        showBaselineResult();
      }, 1800);
    }

    function renderBaseline() {
      if (!baselineRan) renderBaselineIdle();
      else showBaselineResult();
    }

    function renderDiagnose() {
      currentView = "baseline";
      setUploadVisible(false);
      setUnits("diagnose");
      setAlert(
        true,
        `<strong>异常工艺定位完成</strong> · 厌氧池（生物除磷效能不足）· 高效沉淀池（PAC 过量投加）· 深床滤池（受上游絮体负荷影响）`
      );
      el.kpis.innerHTML = kpiHtml(DATA.baseline, "bad");
      makeCharts(DATA.baseline, false);
      el.narrator.innerHTML = "";
      el.actions.innerHTML = `
        <button class="btn btn-ghost" id="showFaults">查看异常工艺示意</button>
        <button class="btn btn-primary" id="toSug">查看调控方案 →</button>
      `;
      document.getElementById("showFaults").onclick = () => openFaultModal(["厌氧", "高效沉淀", "深床滤池"]);
      document.getElementById("toSug").onclick = () => { unlocked = Math.max(unlocked, 2); go(2); };

      el.sideTitle.textContent = "AI 诊断报告";
      el.sideBody.innerHTML = `<div class="ai-log" id="ai"></div>`;
      typeLines(document.getElementById("ai"), [
        `<span class="tag tag-sys">定位</span>异常工艺段：<strong>厌氧池</strong>、<strong>高效沉淀池</strong>、<strong>反硝化深床滤池</strong>。`,
        `<span class="tag tag-a">机理 A</span><strong>问题本质并非 PAC 投加不足。</strong>厌氧段释磷动力不足，回流比对厌氧区稀释过度，生物除磷效能下降，化学除磷被迫代偿。`,
        `<span class="tag tag-b">机理 B</span><strong>高效沉淀段 PAC 过量投加</strong>导致絮体负荷上升，深床滤池阻力与反冲洗频次增加，反硝化条件恶化，出水 TN 波动被放大。`,
        `<span class="tag tag-sys">结论</span>单纯提高药剂投加将推高运行成本并加剧滤池负荷；应优先恢复厌氧释磷条件、优化回流，并下调沉淀段过投水平。`,
      ], 420);

      // 诊断完成后自动弹出异常工艺段示意
      setTimeout(() => openFaultModal(["厌氧", "高效沉淀", "深床滤池"]), 450);
    }

    function renderSuggest() {
      setUploadVisible(false);
      setUnits("suggest");
      setAlert(
        true,
        `<strong>待执行调控</strong> · 建议先进行「仅提高 PAC」对照仿真，再执行 AI 综合方案，以对比根因治理效果。`
      );
      el.kpis.innerHTML = kpiHtml(DATA.baseline, "warn");
      makeCharts(DATA.baseline, false);
      el.narrator.innerHTML = "";
      el.actions.innerHTML = `
        <button class="btn btn-warn" id="tryWrong">对照方案：仅提高 PAC</button>
        <button class="btn btn-primary" id="tryAi">执行 AI 方案并再仿真</button>
      `;
      document.getElementById("tryWrong").onclick = () => runSim("pacOnly");
      document.getElementById("tryAi").onclick = () => runSim("optimized");

      el.sideTitle.textContent = "调控方案";
      el.sideBody.innerHTML = `
        <div class="suggest-list">
          <label class="suggest"><input type="checkbox" checked disabled />
            <div><h4>恢复厌氧释磷条件</h4><p>优化二沉回流，减轻对厌氧区的过度稀释，保障厌氧段 HRT 与氧化还原电位（对应机理 A）。</p></div>
          </label>
          <label class="suggest"><input type="checkbox" checked disabled />
            <div><h4>高效沉淀精细化投加</h4><p>将人工大间隔改设定，改为约 1–2 h 负荷跟随的连续斜坡调节（kg/h），抑制过量投加（对应机理 B）。</p></div>
          </label>
          <label class="suggest"><input type="checkbox" checked disabled />
            <div><h4>沉淀—滤池联立约束</h4><p>以滤池运行压力为约束上限，限制沉淀段过量絮凝，保障反硝化深床稳定运行。</p></div>
          </label>
          <label class="suggest is-wrong"><input type="checkbox" id="wrongPac" />
            <div><h4>对照：仅提高 PAC 投加</h4><p>经验性强化化学除磷方案。用于验证单纯加药无法消除根因，且可能加剧滤池负荷。</p></div>
          </label>
        </div>
      `;
    }

    function runSim(path) {
      unlocked = Math.max(unlocked, 3);
      step = 3;
      renderSteps();
      setUploadVisible(false);
      setAlert(false);
      el.panelTitle.textContent = "方案再仿真";
      el.panelMeta.textContent = path === "pacOnly" ? "PATH · PAC ONLY" : "PATH · AI PLAN";
      el.narrator.innerHTML = path === "pacOnly"
        ? "正在计算：<strong>对照方案（仅提高 PAC）</strong>…"
        : "正在计算：<strong>AI 综合方案</strong>（厌氧/回流优化 + 精细投加 + 滤池约束）…";
      el.actions.innerHTML = "";
      el.sideTitle.textContent = "仿真计算中";
      el.sideBody.innerHTML = `<div class="ai-log">单元串联重算中\n厌氧 → 高效沉淀 → 深床滤池 → 出水指标</div>`;
      el.progress.classList.add("is-on");
      const bar = el.progress.querySelector("i");
      bar.style.animation = "none";
      void bar.offsetWidth;
      bar.style.animation = "";

      setTimeout(() => {
        currentView = path;
        setUnits(path === "pacOnly" ? "pacOnly" : "optimized");
        const d = DATA[path];
        el.kpis.innerHTML = kpiHtml(d, path === "pacOnly" ? "warn" : "ok");
        makeCharts(d);
        if (path === "pacOnly") {
          hideCompareFlash();
          setAlert(true, `<strong>异常未消除</strong> · 仅提高 PAC：单位药耗上升，滤池压力进一步升高，出水 TN 未见改善。`);
          el.narrator.innerHTML = "对照结果：TP 略有改善，但单位药耗升至 <strong>0.131</strong> 元/m³，滤池压力与反冲洗频次升高，TN 无显著好转。表明单纯强化化学除磷无法消除跨单元耦合问题。";
          el.actions.innerHTML = `
            <button class="btn btn-primary" id="tryAi2">改执行 AI 方案并再仿真</button>
            <button class="btn btn-ghost" id="backSug">返回调控方案</button>
          `;
          document.getElementById("tryAi2").onclick = () => runSim("optimized");
          document.getElementById("backSug").onclick = () => go(2);
          el.sideTitle.textContent = "对照方案结论";
          el.sideBody.innerHTML = `<div class="ai-log" id="wrongOut"></div>`;
          typeLines(document.getElementById("wrongOut"), [
            `<span class="tag tag-a">机理 A</span>未恢复厌氧释磷条件，生物除磷效能仍然不足。`,
            `<span class="tag tag-b">机理 B</span>PAC 进一步提高加剧滤池絮体负荷，跨单元耦合问题放大。`,
            `<span class="tag tag-sys">建议</span>改执行 AI 综合方案，以同步改善出水 TP/TN 与单位药耗。`,
          ], 300);
        } else {
          setAlert(false);
          hideCompareFlash();
          const b = metricSnap(DATA.baseline);
          const a = metricSnap(DATA.optimized);
          const savePct = ((b.cost - a.cost) / b.cost * 100).toFixed(0);
          el.narrator.innerHTML = `方案结果：出水 TP 均值 <strong>${b.tp} → ${a.tp}</strong> mg/L，滤池压力 <strong>${b.pressure} → ${a.pressure}</strong>，单位药耗 <strong>${b.cost} → ${a.cost}</strong> 元/m³（约降 ${savePct}%）。点击「查看效果对比」弹出指标对照。`;
          el.actions.innerHTML = `<button class="btn btn-primary" id="toResult">查看效果对比 →</button>`;
          document.getElementById("toResult").onclick = () => { unlocked = Math.max(unlocked, 4); go(4); };
          el.sideTitle.textContent = "AI 方案验证";
          el.sideBody.innerHTML = `<div class="ai-log" id="okOut"></div>`;
          typeLines(document.getElementById("okOut"), [
            `<span class="tag tag-sys">对照</span>基线 TP ${b.tp} / 压力 ${b.pressure} / 药耗 ${b.cost} → AI 方案 TP ${a.tp} / 压力 ${a.pressure} / 药耗 ${a.cost}。`,
            `<span class="tag tag-a">机理 A</span>厌氧条件恢复，生物除磷重新承担主要去除负荷。`,
            `<span class="tag tag-b">机理 B</span>PAC 精细化投加后，滤池压力与出水 TN 同步改善。`,
            `<span class="tag tag-sys">闭环</span>异常识别 → 调控方案 → 再仿真验证，形成完整决策闭环。`,
          ], 300);
        }
      }, 2300);
    }

    function renderResim() {
      if (currentView === "pacOnly" || currentView === "optimized") {
        const path = currentView;
        setUnits(path === "pacOnly" ? "pacOnly" : "optimized");
        const d = DATA[path];
        el.kpis.innerHTML = kpiHtml(d, path === "pacOnly" ? "warn" : "ok");
        makeCharts(d, false);
        hideCompareFlash();
        el.narrator.innerHTML = path === "pacOnly"
          ? "当前为<strong>对照方案</strong>再仿真结果，可继续执行 AI 综合方案。"
          : "当前为<strong>AI 综合方案</strong>再仿真结果，点击「查看效果对比」弹出关键指标对照。";
        el.actions.innerHTML = path === "pacOnly"
          ? `<button class="btn btn-primary" id="tryAi3">改执行 AI 方案并再仿真</button>`
          : `<button class="btn btn-primary" id="toResult2">查看效果对比 →</button>
             <button class="btn btn-ghost" id="tryWrong2">回看对照方案</button>`;
        if (path === "pacOnly") document.getElementById("tryAi3").onclick = () => runSim("optimized");
        else {
          document.getElementById("toResult2").onclick = () => { unlocked = Math.max(unlocked, 4); go(4); };
          document.getElementById("tryWrong2").onclick = () => runSim("pacOnly");
        }
        el.sideTitle.textContent = path === "optimized" ? "AI 方案验证" : "方案再仿真";
        el.sideBody.innerHTML = (path === "optimized"
          ? `<div class="ai-log">
              <div class="line"><span class="tag tag-sys">对照</span>指标已改善，进入效果对比查看并排对照卡。</div>
              <div class="line"><span class="tag tag-sys">下一步</span>点击「查看效果对比」弹出基线 vs AI 方案。</div>
            </div>`
          : `<p style="margin:0;color:var(--muted);font-size:13px;line-height:1.6">可返回调控方案重新选择路径，或进入效果对比。</p>`)
          + `<div class="actions" style="margin-top:12px">
            <button class="btn btn-ghost" id="backSug2">返回调控方案</button>
          </div>`;
        document.getElementById("backSug2").onclick = () => go(2);
      } else {
        hideCompareFlash();
        renderSuggest();
        el.panelTitle.textContent = "方案再仿真";
        el.narrator.innerHTML = "请先在调控方案中选择<strong>对照方案</strong>或<strong>AI 综合方案</strong>。";
      }
    }

    function renderResult() {
      currentView = "optimized";
      setUploadVisible(false);
      setAlert(false);
      setUnits("optimized");
      const b = metricSnap(DATA.baseline);
      const a = metricSnap(DATA.optimized);
      const savePct = ((b.cost - a.cost) / b.cost * 100).toFixed(0);
      el.kpis.innerHTML = kpiHtml(DATA.optimized, "ok");
      makeCharts(DATA.optimized, false);
      showCompareFlash(DATA.baseline, DATA.optimized, "效果对比 · 基线仿真 vs AI 方案");
      el.narrator.innerHTML = `在同一 0–24 h 窗口内，TP ${b.tp}→${a.tp}、压力 ${b.pressure}→${a.pressure}、药耗 ${b.cost}→${a.cost}（约降 ${savePct}%），体现降本增效。`;
      el.actions.innerHTML = `
        <button class="btn btn-ghost" id="replay">重新开始</button>
        <button class="btn btn-primary" id="againWrong">回看对照方案</button>
      `;
      document.getElementById("replay").onclick = () => {
        unlocked = 0;
        baselineRan = false;
        uploadedName = "";
        el.fileInput.value = "";
        currentView = "idle";
        hideCompareFlash();
        go(0);
      };
      document.getElementById("againWrong").onclick = () => { unlocked = Math.max(unlocked, 3); runSim("pacOnly"); };

      el.sideTitle.textContent = "效果对比";
      el.sideBody.innerHTML = `
        <div class="compare">
          <div class="compare-card">
            <h3>基线 / 仅提高 PAC</h3>
            <ul>
              <li>将 TP 升高简单归因于药剂不足</li>
              <li>PAC 提高加剧滤池负荷</li>
              <li>TN 波动未缓解，单位药耗上升</li>
            </ul>
          </div>
          <div class="compare-card">
            <h3>AI 综合方案</h3>
            <ul>
              <li>恢复厌氧生物除磷主路径</li>
              <li>沉淀与滤池联立约束</li>
              <li>出水更稳定，单位药耗下降</li>
            </ul>
          </div>
        </div>
        <div class="big-save">
          <div class="num">↓${savePct}%</div>
          <div class="cap">单位药耗降幅（${b.cost} → ${a.cost} 元/m³）</div>
        </div>
      `;
    }

    if (typeof Chart === "undefined") {
      document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif'>缺少本地 chart.umd.min.js，请与本 HTML 放在同一文件夹后再打开。</p>";
    } else {
      bindUpload();
      bindFaultModal();
      renderSteps();
      go(0);
      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (charts.water) charts.water.resize();
          if (charts.ops) charts.ops.resize();
        }, 120);
      });
    }
  </script>
</body>
</html>
